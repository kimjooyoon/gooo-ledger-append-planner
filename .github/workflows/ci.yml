name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/gooo-ledger-append-planner
      - run: go build ./cmd/gooo-ledger-append-verifier
      - name: Run conformance
        env:
          CONFORMANCE_EVIDENCE_DIR: process/conformance
        run: ./scripts/conformance.sh
      - name: Upload conformance metrics
        uses: actions/upload-artifact@v4
        with:
          name: conformance-metrics-${{ github.run_id }}
          path: process/conformance
          if-no-files-found: error
      - name: Record GitHub Actions evidence
        run: ./scripts/ci-evidence.sh > process/github-actions-evidence-${GITHUB_RUN_ID}.json
      - name: Upload GitHub Actions evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-evidence-${{ github.run_id }}
          path: process/github-actions-evidence-${{ github.run_id }}.json
          if-no-files-found: error
