name: Immutable release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Refuse a non-annotated or mutable tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha")
          test "$(jq -r '.object.type' <<<"$tag_object")" = commit
          target=$(jq -r '.object.sha' <<<"$tag_object")
          test "$target" = "$GITHUB_SHA"
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}") || true
          if test -n "$release"; then
            echo "release already exists; refusing to rewrite it"
            exit 1
          fi
      - run: go test ./...
      - run: ./scripts/conformance.sh
      - run: go build -o gooo-ledger-append-planner ./cmd/gooo-ledger-append-planner
      - run: go build -o gooo-ledger-append-verifier ./cmd/gooo-ledger-append-verifier
      - name: Require immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable=$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases")
          test "$(jq -r '.enabled' <<<"$immutable")" = true
      - name: Package exact source and checksums
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix=gooo-ledger-append-planner-${GITHUB_REF_NAME}/ -o "release/gooo-ledger-append-planner-source-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          cp gooo-ledger-append-planner release/gooo-ledger-append-planner-linux-amd64-${GITHUB_REF_NAME}
          sha256sum release/* > release/SHA256SUMS
      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes "Immutable release for the structural append transaction planner."
      - name: Generate release audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-audit.sh > release/release-audit.json
      - name: Upload release audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ github.ref_name }}
          path: release/release-audit.json
          if-no-files-found: error
