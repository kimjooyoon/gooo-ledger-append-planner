name: Immutable release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag to audit and release"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Refuse a non-annotated or mutable tag target
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
        run: |
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object_sha")
          test "$(jq -r '.object.type' <<<"$tag_object")" = commit
          target=$(jq -r '.object.sha' <<<"$tag_object")
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$target" = "$GITHUB_SHA"
          fi
          echo "RELEASE_TARGET_SHA=$target" >> "$GITHUB_ENV"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release already exists; refusing to rewrite it"
            exit 1
          fi
      - run: go test ./...
      - run: ./scripts/conformance.sh
      - name: Require immutable releases
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
        run: |
          immutable=$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases")
          test "$(jq -r '.enabled' <<<"$immutable")" = true
      - name: Package exact source and checksums
        run: |
          mkdir -p release
          git worktree add --detach release-build "$RELEASE_TARGET_SHA"
          go build -o gooo-ledger-append-planner release-build/cmd/gooo-ledger-append-planner
          go build -o gooo-ledger-append-verifier release-build/cmd/gooo-ledger-append-verifier
          git archive --format=tar.gz --prefix=gooo-ledger-append-planner-${RELEASE_TAG}/ -o "release/gooo-ledger-append-planner-source-${RELEASE_TAG}.tar.gz" "$RELEASE_TARGET_SHA"
          cp gooo-ledger-append-planner release/gooo-ledger-append-planner-linux-amd64-${RELEASE_TAG}
          sha256sum release/* > release/SHA256SUMS
      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ inputs.tag || github.ref_name }}
          path: release/*
          if-no-files-found: error
      - name: Publish once
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
        run: gh release create "$RELEASE_TAG" release/* --title "$RELEASE_TAG" --notes "Immutable release for the structural append transaction planner."
      - name: Generate release audit
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
        run: ./scripts/release-audit.sh > release/release-audit.json
      - name: Upload release audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ inputs.tag || github.ref_name }}
          path: release/release-audit.json
          if-no-files-found: error
