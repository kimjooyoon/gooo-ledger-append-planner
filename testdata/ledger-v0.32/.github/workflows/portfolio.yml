          test "$(wc -c < "$learning_dir/gooo-reflexive-loop-v0.4.0-source.tar.gz" | tr -d ' ')" = 96363
          test "$(wc -c < "$learning_dir/gooo-reflexive-loop-v0.4.0-evidence.tar.gz" | tr -d ' ')" = 2468418
