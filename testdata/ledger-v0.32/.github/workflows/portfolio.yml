          test "$(sha256sum "$learning_dir/gooo-reflexive-loop-v0.4.0-source.tar.gz" | awk '{print $1}')" = fc8f5e551bb335d0a9133623c2fdc4549f634a93645b41b8fbb7c0acc98ab957
          test "$(sha256sum "$learning_dir/gooo-reflexive-loop-v0.4.0-evidence.tar.gz" | awk '{print $1}')" = 1bac0c50f4508922b5351df3a541f4daa115c60867ca106d11d4593e7c58b5ce
          test "$(sha256sum "$learning_dir/SHA256SUMS" | awk '{print $1}')" = e55c31a6c66eb82cfcf2d8b39182e07fd39f35f45a7bddfd17407025bda59dc0
          test "$(awk 'NF {count++} END {print count+0}' "$learning_dir/SHA256SUMS")" = 3
          test "$(awk 'NF {print NF}' "$learning_dir/SHA256SUMS" | sort -u)" = 2
          while read -r declared_digest asset_name; do
            test "$asset_name" = "gooo-reflexive-loop-v0.4.0-source.tar.gz" || test "$asset_name" = "gooo-reflexive-loop-v0.4.0-evidence.tar.gz" || test "$asset_name" = "gooo-reflexive-loop-v0.4.0-manifest.json"
            test "$(sha256sum "$learning_dir/$asset_name" | awk '{print $1}')" = "$declared_digest"
          done < <(awk '{print $1" "$2}' "$learning_dir/SHA256SUMS")
          resolution_dir="$ARTIFACT_ROOT/releases/unknown_resolution_lattice_release/assets"
          jq -e '. == {commit:"fac2f5c0688c62fd31912a310e0fae77bc198258",go_version:"go1.27.0",immutable:true,schema:"gooo/resolution-lattice/release-manifest/v1",tag:"v0.2.0"}' "$resolution_dir/release-manifest.json" >/dev/null
          test "$(wc -c < "$resolution_dir/gooo-resolution-lattice-0.2.0.tar.gz" | tr -d ' ')" = 23967
          test "$(wc -c < "$resolution_dir/release-manifest.json" | tr -d ' ')" = 186
          test "$(wc -c < "$resolution_dir/SHA256SUMS" | tr -d ' ')" = 103
          test "$(sha256sum "$resolution_dir/gooo-resolution-lattice-0.2.0.tar.gz" | awk '{print $1}')" = f16f43175104a42eb20fd8f701fa8296c289ce69929ff1861269cb3b00ebbc75
          test "$(sha256sum "$resolution_dir/release-manifest.json" | awk '{print $1}')" = c178b312da828be4589352fbc195853ccaa08e48adacf7f5522c4a06df65f9fd
          test "$(sha256sum "$resolution_dir/SHA256SUMS" | awk '{print $1}')" = 8a9b8575cdd5abae5ebba2d1e33a6e93f6b6bfcd7d3ac6855529c74652454549
          test "$(cat "$resolution_dir/SHA256SUMS")" = "f16f43175104a42eb20fd8f701fa8296c289ce69929ff1861269cb3b00ebbc75  gooo-resolution-lattice-0.2.0.tar.gz"
          tar -tzf "$resolution_dir/gooo-resolution-lattice-0.2.0.tar.gz" | grep -Fx 'gooo-resolution-lattice-0.2.0/.github/workflows/conformance.yml' >/dev/null
          tar -tzf "$resolution_dir/gooo-resolution-lattice-0.2.0.tar.gz" | grep -Fx 'gooo-resolution-lattice-0.2.0/.github/workflows/release.yml' >/dev/null
          self_repair_dir="$ARTIFACT_ROOT/releases/self_repair_integration_release/assets"
          jq -e '. == {commit:"28f3589d69796b4630b2e066c6a5c45ac8468096",immutable:true,schema:"gooo.self-repair.release-manifest.v1",tag:"v0.2.1"}' "$self_repair_dir/release-manifest.json" >/dev/null
          test "$(wc -c < "$self_repair_dir/gooo-self-repair-example-0.2.1.tar.gz" | tr -d ' ')" = 30698
          test "$(wc -c < "$self_repair_dir/release-manifest.json" | tr -d ' ')" = 134
          test "$(wc -c < "$self_repair_dir/SHA256SUMS" | tr -d ' ')" = 104
          test "$(sha256sum "$self_repair_dir/gooo-self-repair-example-0.2.1.tar.gz" | awk '{print $1}')" = 7d505a14cfd11c0d6a57cb14ec8de2f51c946285b18d1af8bce1d6ff476b4582
          test "$(sha256sum "$self_repair_dir/release-manifest.json" | awk '{print $1}')" = 3655571de02ba889fe83676d700e43befbf6130730079a26bed6aa6b65adcdd3
          test "$(sha256sum "$self_repair_dir/SHA256SUMS" | awk '{print $1}')" = fd70f404c9238fb6fd2ace7cf36b19ed0ce7d89d15fc794ce96ee4d5333f5d1f
          test "$(cat "$self_repair_dir/SHA256SUMS")" = "7d505a14cfd11c0d6a57cb14ec8de2f51c946285b18d1af8bce1d6ff476b4582  gooo-self-repair-example-0.2.1.tar.gz"
          tar -tzf "$self_repair_dir/gooo-self-repair-example-0.2.1.tar.gz" | grep -Fx 'gooo-self-repair-example-0.2.1/.github/workflows/ci.yml' >/dev/null
          tar -tzf "$self_repair_dir/gooo-self-repair-example-0.2.1.tar.gz" | grep -Fx 'gooo-self-repair-example-0.2.1/.github/workflows/release.yml' >/dev/null
          self_repair_artifact="$RUNNER_TEMP/self-repair-artifact-9770678796.zip"
          gh api repos/kimjooyoon/gooo-self-repair-example/actions/artifacts/9770678796/zip > "$self_repair_artifact"
          test "$(wc -c < "$self_repair_artifact" | tr -d ' ')" = 14701
          test "$(sha256sum "$self_repair_artifact" | awk '{print $1}')" = 870a731cf484535e2b1218e1d7eee37a0ccdd9c7ad194ff19030ab31e42c7514
