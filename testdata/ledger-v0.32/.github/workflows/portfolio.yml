          jq -e '. == {schema:"gooo/evolution-trial/release-audit/v1",repository:"kimjooyoon/gooo-evolution-trial",tag:"v0.2.0",release_id:380109530,tag_object:"b05e646ac009208e2451473b019b5768a4b20bb8",target_commit:"aa72f7019d1224344802478490d94046d27af58f",run_id:33449476756,job_id:99675899128,assets:[{id:538638669,name:"experiment-dossier-v0.2.0.md",size:2345,digest:"sha256:7cf59e690e9458eefffcb9cfd536119f6669146bf00aa96a365ee3bc1af688ac"},{id:538638668,name:"gooo-evolution-trial-source-v0.2.0.tar.gz",size:30429,digest:"sha256:984ef2a192221adc8ebeaeb8489e6a1bf450238d16036c045c4382fe19429218"},{id:538638665,name:"release-manifest-v0.2.0.json",size:764,digest:"sha256:48f4dd0c1391f9ec91654e8d2b25a67942e8e6febd3461c61d0651a35896153f"},{id:538638674,name:"SHA256SUMS",size:469,digest:"sha256:bc867402084059cda6fd1f9590f94b45f807725001c2d9e927e13808be8e9aca"},{id:538638666,name:"upstream-lock-v0.2.0.json",size:4134,digest:"sha256:28f5457240fb35d3c24c65373f824cb5df918f003245b60cb5389ca3618e4120"},{id:538638667,name:"version.json",size:319,digest:"sha256:c11572b368dcc984ea4c2666ec4aa46dc43c3434cd913cac044daf6142bb9f74"}],immutable:true}' "$audit_dir/release-audit.json" >/dev/null
          tag_json="$RUNNER_TEMP/gooo-evolution-trial-tag.json"
          gh api "repos/$trial_repo/git/ref/tags/v0.2.0" > "$tag_json"
          jq -e '.object.sha=="b05e646ac009208e2451473b019b5768a4b20bb8" and .object.type=="tag"' "$tag_json" >/dev/null
          gh api "repos/$trial_repo/git/tags/b05e646ac009208e2451473b019b5768a4b20bb8" > "$RUNNER_TEMP/gooo-evolution-trial-tag-object.json"
          jq -e '.object.sha=="aa72f7019d1224344802478490d94046d27af58f" and .object.type=="commit"' "$RUNNER_TEMP/gooo-evolution-trial-tag-object.json" >/dev/null
          trial_refs=$(git ls-remote "https://github.com/$trial_repo.git" refs/tags/v0.2.0 'refs/tags/v0.2.0^{}')
          test "$(awk '$2=="refs/tags/v0.2.0" {print $1}' <<< "$trial_refs")" = b05e646ac009208e2451473b019b5768a4b20bb8
          test "$(awk '$2=="refs/tags/v0.2.0^{}" {print $1}' <<< "$trial_refs")" = aa72f7019d1224344802478490d94046d27af58f
          echo "upstream executable evolution trial closed-loop durable release and exact CLOSED evidence verified"

      - name: Verify separate seventeen-entry non-completeness capability evidence registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/verify-capability-evidence-registry.sh \
            contracts/non-completeness-capability-evidence-registry-v1.json \
            evidence/non-completeness-capability-evidence-registry-v1.json \
            "$ARTIFACT_ROOT/capability-registry"
          jq -e '.entry_count==17 and .summary=={closed:13,unknown:0,refuted:4} and (has("percentage")|not) and (has("score")|not)' \
            "$ARTIFACT_ROOT/capability-registry/verification.json" >/dev/null

      - name: Materialize runtime measurements
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(cat "$RUNNER_TEMP/repository-before")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-after"
          test "$before" = "$(cat "$RUNNER_TEMP/repository-after")"
          fetch=$(jq '.timing.fetch' "$ARTIFACT_ROOT/releases/verification.json")
          verify=$(jq '.timing.verify' "$ARTIFACT_ROOT/releases/verification.json")
          ci=$(cat "$ARTIFACT_ROOT/ci-observations.json")
          verify_rss=$(cat "$ARTIFACT_ROOT/release-verify-peak-rss")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/runtime/v1" \
            --arg subject "$SUBJECT_SHA" --arg go_version "$(go env GOVERSION)" \
            --argjson fetch "$fetch" --argjson verify "$verify" --argjson verify_rss "$verify_rss" --argjson ci "$ci" \
            '{schema:$schema,subject_sha:$subject,go_version:$go_version,timing:{fetch:$fetch,verify:($verify|.peak_rss_kib=$verify_rss),report:{wall_ms:0,duration_ns:0,peak_rss_kib:0}},ci_observations:$ci,authority:{runtime_repository_writes:0,caller_owned_temp_output:true,cross_project_required_gates:0},local_execution_counts:{gofmt:0,build:0,test:0,vet:0,conformance:0}}' \
            > "$ARTIFACT_ROOT/runtime.json"

      - name: Run fixed-denominator conformance and emit human report
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/conformance.sh "$RUNNER_TEMP/ledger-report" "$GITHUB_WORKSPACE" "$ARTIFACT_ROOT"
          final_before=$(cat "$RUNNER_TEMP/repository-after")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-final"
          test "$final_before" = "$(cat "$RUNNER_TEMP/repository-final")"
          jq -e '.repository_writes==0 and .summary=={total:38,closed:35,unknown:1,refuted:2}' "$ARTIFACT_ROOT/conformance.json" >/dev/null
          cat "$ARTIFACT_ROOT/ci-observations.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/conformance.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/capability-registry/verification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload human-readable evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-self-improvement-ledger-${{ env.SUBJECT_SHA }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        if: always()
        run: |
          {
            echo "### Evidence artifact"
            echo "artifact_id: ${{ steps.evidence.outputs.artifact-id }}"
            echo "artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
